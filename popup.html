<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="popupHeading">Google 搜索直达</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f5f7fa;
    --text: #1f2329;
    --muted: #8a9099;
    --line: #e5e7eb;
    --primary: #2563eb;
    --active-bg: #eff5ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 320px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 15px; }
  .current { margin-top: 4px; color: var(--primary); font-weight: 600; }
  .hint { color: var(--muted); font-size: 11px; }
  #list { max-height: 340px; overflow-y: auto; padding: 6px; }
  .pack {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 9px;
    margin: 0 0 2px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    text-align: left;
    font: inherit;
    cursor: pointer;
  }
  .pack:hover { background: var(--panel); }
  .pack.active { background: var(--active-bg); border-color: #c7d9ff; }
  .pack .icon { font-size: 16px; width: 20px; text-align: center; }
  .pack .name { flex: 1 1 auto; }
  .pack .key {
    flex: 0 0 auto;
    font-size: 10px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .pack.active .key { color: var(--primary); border-color: #c7d9ff; }
  footer {
    display: flex;
    gap: 8px;
    padding: 10px 16px 12px;
    border-top: 1px solid var(--line);
  }
  footer button {
    flex: 1;
    padding: 6px 4px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  footer button:hover { border-color: var(--primary); color: var(--primary); }
  #status { padding: 0 16px; color: var(--primary); min-height: 0; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="popupHeading">Google 搜索直达</h1>
  <div class="current" id="current" data-i18n="loading">加载中…</div>
  <div class="hint" data-i18n="popupHintRight">右键选中文字 → 按当前网站包的优先顺序打开结果</div>
  <div class="hint" data-i18n="popupHintKeys">弹窗内按 1~8 切换，按 0 循环</div>
</header>
<div id="list"></div>
<div id="status"></div>
<footer>
  <button type="button" id="shortcuts" data-i18n="btnShortcuts">快捷键设置</button>
  <button type="button" id="settings" data-i18n="btnSettings">管理网站包</button>
</footer>
<script src="i18n-data.js"></script>
<script src="i18n.js"></script>
<script src="packs.js"></script>
<script src="popup.js"></script>
</body>
</html>
