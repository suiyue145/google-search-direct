<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google 搜索直达 - 设置</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f7f8fa;
    --text: #1f2329;
    --muted: #646a73;
    --line: #dee0e3;
    --primary: #2563eb;
    --danger: #d54941;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  label { display: block; font-weight: 600; margin: 20px 0 8px; }
  select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    font: inherit;
  }
  select:focus { outline: 2px solid rgba(37, 99, 235, .25); border-color: var(--primary); }

  .domain-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .domain-row .rank {
    flex: 0 0 26px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .domain-row input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    font: inherit;
  }
  .domain-row input:focus { outline: 2px solid rgba(37, 99, 235, .25); border-color: var(--primary); }
  .domain-row button {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }
  .domain-row button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  .domain-row button:disabled { opacity: .35; cursor: default; }
  .domain-row button.del:hover { border-color: var(--danger); color: var(--danger); }

  .ghost-btn {
    margin-top: 4px;
    padding: 7px 12px;
    border: 1px dashed var(--line);
    background: #fff;
    color: var(--primary);
    border-radius: 6px;
    cursor: pointer;
    font: inherit;
  }
  .ghost-btn:hover { border-color: var(--primary); }

  .presets { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    border-radius: 14px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  .presets button:hover { border-color: var(--primary); color: var(--primary); }

  #save {
    margin-top: 24px;
    width: 100%;
    padding: 10px;
    border: 0;
    border-radius: 6px;
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #save:hover { background: #1d4ed8; }
  #status { min-height: 22px; margin: 10px 0 0; color: #16803c; }
  .help {
    margin-top: 28px;
    padding: 14px 16px;
    background: var(--panel);
    border-radius: 6px;
    color: var(--muted);
    font-size: 13px;
  }
  .help p { margin: 0 0 8px; }
  .help p:last-child { margin-bottom: 0; }
  code { background: #eceff3; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Google 搜索直达</h1>
  <p class="sub">选中文字 → 右键 → Google 搜索 → 按优先顺序自动打开网站结果</p>

  <label>默认网站（按优先顺序）</label>
  <div id="domain-list"></div>
  <button type="button" class="ghost-btn" id="add-domain">+ 添加网站</button>
  <div class="presets" id="presets"></div>

  <label for="mode">打开方式</label>
  <select id="mode">
    <option value="newtab">新标签页打开（推荐，保留 Google 结果）</option>
    <option value="navigate">在当前标签页跳转</option>
  </select>

  <button id="save">保存设置</button>
  <p id="status"></p>

  <div class="help">
    <p><strong>使用说明</strong></p>
    <p>1. 按优先顺序填写域名，用 ↑ ↓ 调整顺序——排在前面的网站会优先被打开。</p>
    <p>2. 域名不用写 <code>https://</code> 和 <code>www.</code>，写了也能识别。</p>
    <p>3. 选中文字后右键 →「Google 搜索并自动打开默认网站」。</p>
    <p>4. 插件会检查 Google 结果：第一个网站有结果就打开它；没有就依次试第二个、第三个……全部没有则保留 Google 页面。</p>
    <p>5. 同一网站取搜索结果里排名最靠前的那条链接。</p>
  </div>
</div>
<script src="options.js"></script>
</body>
</html>
