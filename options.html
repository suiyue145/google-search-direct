<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="optTitle">Google 搜索直达 - 网站包管理</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f7f8fa;
    --text: #1f2329;
    --muted: #646a73;
    --line: #dee0e3;
    --primary: #2563eb;
    --danger: #d54941;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }

  .pack {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    background: #fff;
  }
  .pack.is-active { border-color: #9dbdfb; background: #f8fbff; }
  .pack-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .pack-head input.icon {
    width: 40px; height: 34px; text-align: center;
    border: 1px solid var(--line); border-radius: 6px; font: inherit;
  }
  .pack-head input.name {
    flex: 1 1 auto; min-width: 0; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 6px; font: inherit;
  }
  .key-hint {
    flex: 0 0 auto; color: var(--muted); font-size: 11px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 2px 6px;
  }
  .btn {
    flex: 0 0 auto; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; color: var(--text);
    font: inherit; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: #1d4ed8; color: #fff; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn.small { padding: 4px 9px; font-size: 12px; }

  .domain-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .domain-row .rank { flex: 0 0 24px; text-align: center; color: var(--muted); font-size: 12px; }
  .domain-row input {
    flex: 1 1 auto; min-width: 0; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 6px; font: inherit;
  }
  .domain-row .btn.small { width: 28px; padding: 4px 0; text-align: center; }
  .empty { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }

  select, textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; color: var(--text); font: inherit;
  }
  textarea { min-height: 130px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  #save {
    margin-top: 24px; width: 100%; padding: 11px; border: 0; border-radius: 6px;
    background: var(--primary); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #save:hover { background: #1d4ed8; }
  #status { min-height: 22px; margin: 10px 0 0; color: #16803c; }
  .hint-text { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .help {
    margin-top: 28px; padding: 14px 16px; background: var(--panel);
    border-radius: 6px; color: var(--muted); font-size: 13px;
  }
  .help p { margin: 0 0 8px; }
  .help p:last-child { margin-bottom: 0; }
  code { background: #eceff3; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 data-i18n="optTitle">Google 搜索直达 · 网站包管理</h1>
  <p class="sub" data-i18n="optSubtitle">为不同爱好配置不同的网站优先列表，点工具栏图标或按快捷键秒切</p>

  <h2 data-i18n="sectionUILang">界面语言</h2>
  <select id="ui-lang">
    <option value="auto" data-i18n="uiLangAuto">跟随系统语言（自动）</option>
    <option value="zh_CN" data-i18n="uiLangZh">简体中文</option>
    <option value="en" data-i18n="uiLangEn">English</option>
  </select>
  <p class="hint-text" data-i18n="uiLangHint">默认跟随系统/浏览器语言；也可固定为中文或英文。</p>

  <h2 data-i18n="sectionLocale">默认网站列表</h2>
  <select id="locale">
    <option value="auto" data-i18n="presetAuto">跟随系统语言（推荐）</option>
    <option value="zh_CN" data-i18n="presetZh">中文网站</option>
    <option value="en" data-i18n="presetEn">英文网站</option>
  </select>
  <p class="hint-text" data-i18n="presetHint">新安装时按系统语言自动选择；也可手动指定。</p>

  <h2 data-i18n="sectionPacks">网站包</h2>
  <div id="packs"></div>
  <div class="actions">
    <button type="button" class="btn" id="add-pack" data-i18n="btnAddPack">+ 新建网站包</button>
    <button type="button" class="btn" id="reset-packs" data-i18n="btnResetPacks">恢复内置预设</button>
    <button type="button" class="btn" id="open-shortcuts" data-i18n="btnShortcuts">设置快捷键</button>
  </div>

  <h2 data-i18n="sectionMode">打开方式</h2>
  <select id="mode">
    <option value="newtab" data-i18n="modeNewTab">新标签页打开（推荐，保留 Google 结果）</option>
    <option value="navigate" data-i18n="modeNavigate">在当前标签页跳转</option>
  </select>

  <h2 data-i18n="sectionConfig">导入 / 导出配置（可发给别人共用）</h2>
  <textarea id="config-json" spellcheck="false" data-i18n-placeholder="configPlaceholder" placeholder="点击「导出」生成配置，或粘贴别人的配置后点「导入」"></textarea>
  <div class="row">
    <button type="button" class="btn" id="export" data-i18n="btnExport">导出到文本框</button>
    <button type="button" class="btn" id="copy" data-i18n="btnCopy">复制配置</button>
    <button type="button" class="btn" id="import" data-i18n="btnImport">导入文本框配置</button>
  </div>

  <button id="save" data-i18n="btnSave">保存设置</button>
  <p id="status"></p>

  <div class="help">
    <p><strong data-i18n="helpTitle">使用说明</strong></p>
    <p data-i18n="help1"></p>
    <p data-i18n="help2"></p>
    <p data-i18n="help3"></p>
    <p data-i18n="help4"></p>
    <p data-i18n="help5"></p>
  </div>
</div>
<script src="i18n-data.js"></script>
<script src="i18n.js"></script>
<script src="packs.js"></script>
<script src="options.js"></script>
</body>
</html>
